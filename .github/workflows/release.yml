name: Release

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled, closed]

permissions: {}

jobs:
  release-label:
    name: Validate release label
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: release-label-${{ github.event.pull_request.number }}
      queue: max
    permissions:
      contents: read
      pull-requests: write
    steps:
      # pull_request_target checks out trusted base code here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply the opening default and validate current labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
        run: python3 .github/release.py validate "$PR_NUMBER" "$PR_ACTION"

  tests:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}

  tag-release:
    name: Tag merged PR
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: addon-release-tags
      queue: max
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Push the next dated tag for the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: python3 .github/release.py tag "$PR_NUMBER" "$MERGED_SHA"
