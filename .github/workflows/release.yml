name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  merged-pr:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.pr.outputs.result }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - id: pr
        name: Check for a merged PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          result-encoding: string
          script: |
            const { owner, repo } = context.repo;
            const pulls = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner, repo, commit_sha: context.sha, per_page: 100 }
            );
            const merged = pulls.find(pr =>
              pr.merged_at && pr.base.ref === 'main' &&
              pr.base.repo.full_name === `${owner}/${repo}` &&
              pr.merge_commit_sha === context.sha
            );
            return merged ? String(merged.number) : '';

  tests:
    needs: merged-pr
    if: needs.merged-pr.outputs.number != ''
    uses: ./.github/workflows/ci.yml

  tag-release:
    name: Tag merged PR
    needs: [merged-pr, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: addon-release-tags
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Tag the next version after a tested merge
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          MERGED_PR: ${{ needs.merged-pr.outputs.number }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const tags = await github.paginate(github.rest.repos.listTags,
              { owner, repo, per_page: 100 });
            const pattern = /^v(\d+)\.(\d+)\.(\d+)(-(alpha|beta)(?:\.(\d+))?)?$/;
            const versions = tags.filter(tag => pattern.test(tag.name));
            if (versions.some(tag => tag.commit.sha === sha)) {
              core.info('This commit already has a version tag.');
              return;
            }
            const parts = name => {
              const m = name.match(pattern);
              return [+m[1], +m[2], +m[3],
                m[5] === 'alpha' ? 0 : m[5] === 'beta' ? 1 : 2, +(m[6] || 0)];
            };
            versions.sort((a, b) => {
              const av = parts(a.name), bv = parts(b.name);
              for (let i = 0; i < av.length; i++) {
                if (av[i] !== bv[i]) return bv[i] - av[i];
              }
              return 0;
            });
            let version = 'v0.3.0-beta';
            if (versions.length) {
              const m = versions[0].name.match(pattern);
              version = `v${+m[1]}.${+m[2]}.${+m[3] + 1}${m[4] || ''}`;
            }
            const tag = await github.rest.git.createTag({
              owner, repo, tag: version,
              message: `Release ${version} (PR #${process.env.MERGED_PR})`,
              object: sha, type: 'commit'
            });
            await github.rest.git.createRef({
              owner, repo, ref: `refs/tags/${version}`, sha: tag.data.sha
            });
            core.info(`Created ${version} for ${sha}`);
