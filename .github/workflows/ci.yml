name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
      - name: Lua syntax and named test cases
        run: |
          luac5.1 -p AHDBAuctionatorSync.lua
          mapfile -t cases < <(find tests/lua -name 'test_*.lua' | sort)
          lua5.1 tests/run.lua "${cases[@]}"
      - name: Build with BigWigs without publishing
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          args: -d -g forever
          pandoc: 'false'
      - name: Check package contents
        run: python3 tests/check_package.py
      - name: Retain test package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: addon-test-package
          path: .release/*.zip
          if-no-files-found: error
