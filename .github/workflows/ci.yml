name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
      - name: Independent Lua test cases
        env:
          LC_ALL: C
        run: |
          luac5.1 -p AHDBAuctionatorSync.lua
          shopt -s nullglob
          cases=(tests/[0-9][0-9][0-9]_*.lua)
          test "${#cases[@]}" -gt 0 || { echo 'No Lua test cases found'; exit 1; }
          failed=0
          for test in "${cases[@]}"; do
            echo "::group::$test"
            if lua5.1 "$test"; then
              echo "PASS: $test"
            else
              echo "FAIL: $test"
              failed=1
            fi
            echo '::endgroup::'
          done
          exit "$failed"
      - name: Build with BigWigs without publishing
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          args: -d -g forever
          pandoc: 'false'
      - name: Independent Python test cases
        env:
          LC_ALL: C
        run: |
          shopt -s nullglob
          cases=(tests/[0-9][0-9][0-9]_*.py)
          test "${#cases[@]}" -gt 0 || { echo 'No Python test cases found'; exit 1; }
          failed=0
          for test in "${cases[@]}"; do
            echo "::group::$test"
            if python3 "$test"; then
              echo "PASS: $test"
            else
              echo "FAIL: $test"
              failed=1
            fi
            echo '::endgroup::'
          done
          exit "$failed"
      - name: Retain test package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: addon-test-package
          path: .release/*.zip
          if-no-files-found: error
