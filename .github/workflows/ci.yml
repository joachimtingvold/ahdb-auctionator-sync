name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test CI commit selection
        run: python3 tests/test_ci.py
      - id: select
        name: Select pushed commits and PR merge result
        run: python3 tests/select_commits.py

  checks:
    name: Check ${{ matrix.label }}
    needs: commits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.commits.outputs.matrix) }}
    steps:
      - name: Checkout test suite
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: ci
          persist-credentials: false
      - name: Checkout commit under test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
      - name: Lua syntax and named test cases
        working-directory: source
        run: |
          luac5.1 -p AHDBAuctionatorSync.lua
          mapfile -t cases < <(find ../ci/tests/lua -name 'test_*.lua' | sort)
          lua5.1 ../ci/tests/run.lua "${cases[@]}"
      - name: Build with BigWigs without publishing
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          args: -d -g forever -t source
          pandoc: 'false'
      - name: Check package contents
        working-directory: source
        run: python3 ../ci/tests/check_package.py
      - name: Retain test package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: addon-${{ matrix.label }}
          path: source/.release/*.zip
          if-no-files-found: error

  test-and-package:
    if: always()
    needs: [commits, checks]
    runs-on: ubuntu-latest
    steps:
      - name: Require every commit and merge check to pass
        env:
          SELECTION_RESULT: ${{ needs.commits.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$SELECTION_RESULT" = success && test "$CHECKS_RESULT" = success

  tag-release:
    name: Tag merged PR
    needs: test-and-package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: addon-release-tags
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Tag the next version after a tested merge
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const pulls = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner, repo, commit_sha: sha, per_page: 100 }
            );
            const merged = pulls.find(pr =>
              pr.merged_at && pr.base.ref === 'main' &&
              pr.base.repo.full_name === `${owner}/${repo}` &&
              pr.merge_commit_sha === sha
            );
            if (!merged) {
              core.info('No merged PR for this commit; no release tag created.');
              return;
            }

            const tags = await github.paginate(github.rest.repos.listTags,
              { owner, repo, per_page: 100 });
            const pattern = /^v(\d+)\.(\d+)\.(\d+)(-(alpha|beta)(?:\.(\d+))?)?$/;
            const versions = tags.filter(tag => pattern.test(tag.name));
            if (versions.some(tag => tag.commit.sha === sha)) {
              core.info('This commit already has a version tag.');
              return;
            }
            const parts = name => {
              const m = name.match(pattern);
              return [+m[1], +m[2], +m[3],
                m[5] === 'alpha' ? 0 : m[5] === 'beta' ? 1 : 2, +(m[6] || 0)];
            };
            versions.sort((a, b) => {
              const av = parts(a.name), bv = parts(b.name);
              for (let i = 0; i < av.length; i++) {
                if (av[i] !== bv[i]) return bv[i] - av[i];
              }
              return 0;
            });
            let version = 'v0.3.0-beta';
            if (versions.length) {
              const m = versions[0].name.match(pattern);
              version = `v${+m[1]}.${+m[2]}.${+m[3] + 1}${m[4] || ''}`;
            }
            const tag = await github.rest.git.createTag({
              owner, repo, tag: version,
              message: `Release ${version} (PR #${merged.number})`,
              object: sha, type: 'commit'
            });
            await github.rest.git.createRef({
              owner, repo, ref: `refs/tags/${version}`, sha: tag.data.sha
            });
            core.info(`Created ${version} for ${sha}`);
