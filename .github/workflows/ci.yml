name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source and tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
      - name: Verify Lua and tests
        run: |
          luac5.1 -p AHDBAuctionatorSync.lua tests/test_sync.lua
          lua5.1 tests/test_sync.lua
      - name: Build without publishing
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0; Forever support
        with:
          args: -d -g forever
          pandoc: 'false'
      - name: Verify installable archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          archives = list(Path(".release").glob("*.zip"))
          assert len(archives) == 1, f"Expected one package, found {archives}"
          with zipfile.ZipFile(archives[0]) as archive:
              files = {name for name in archive.namelist() if not name.endswith("/")}
              prefix = "AHDBAuctionatorSync/"
              required = {prefix + name for name in (
                  "AHDBAuctionatorSync.lua", "AHDBAuctionatorSync.toc", "LICENSE",
                  "README.md", "CHANGELOG.md",
              )}
              assert required <= files, f"Missing addon files: {required - files}"
              assert all(name.startswith(prefix) and ".." not in name.split("/") for name in files)
              assert not any(part in {".github", "tests", "tools", "docs", ".git"}
                             for name in files for part in name.split("/")), files
              toc = archive.read(prefix + "AHDBAuctionatorSync.toc").decode()
              assert "@project-version@" not in toc, "Version token was not replaced"
              assert "## Interface: 16001" in toc
              assert "## Dependencies: AuctionDB, Auctionator" in toc
              assert archive.read(prefix + "AHDBAuctionatorSync.lua").replace(b"\r\n", b"\n") == Path(
                  "AHDBAuctionatorSync.lua").read_bytes().replace(b"\r\n", b"\n"), "Addon code changed during packaging"
              assert archive.read(prefix + "CHANGELOG.md").replace(b"\r\n", b"\n") == Path(
                  "CHANGELOG.md").read_bytes().replace(b"\r\n", b"\n"), "Changelog differs"
          print(f"PASS: {archives[0]} contains an installable Forever addon and changelog")
          PY
      - name: Retain installable test package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: addon-test-package
          path: .release/*.zip
          if-no-files-found: error

  tag-release:
    name: Tag merged PR
    needs: test-and-package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: addon-release-tags
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Tag the next version after a tested merge
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const pulls = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner, repo, commit_sha: sha, per_page: 100 }
            );
            const merged = pulls.find(pr =>
              pr.merged_at && pr.base.ref === 'main' &&
              pr.base.repo.full_name === `${owner}/${repo}` &&
              pr.merge_commit_sha === sha
            );
            if (!merged) {
              core.info('No merged PR for this commit; no release tag created.');
              return;
            }

            const tags = await github.paginate(github.rest.repos.listTags,
              { owner, repo, per_page: 100 });
            const pattern = /^v(\d+)\.(\d+)\.(\d+)(-(alpha|beta)(?:\.(\d+))?)?$/;
            const versions = tags.filter(tag => pattern.test(tag.name));
            if (versions.some(tag => tag.commit.sha === sha)) {
              core.info('This commit already has a version tag.');
              return;
            }
            const parts = name => {
              const m = name.match(pattern);
              return [+m[1], +m[2], +m[3],
                m[5] === 'alpha' ? 0 : m[5] === 'beta' ? 1 : 2, +(m[6] || 0)];
            };
            versions.sort((a, b) => {
              const av = parts(a.name), bv = parts(b.name);
              for (let i = 0; i < av.length; i++) {
                if (av[i] !== bv[i]) return bv[i] - av[i];
              }
              return 0;
            });
            let version = 'v0.3.0-beta';
            if (versions.length) {
              const m = versions[0].name.match(pattern);
              version = `v${+m[1]}.${+m[2]}.${+m[3] + 1}${m[4] || ''}`;
            }
            const tag = await github.rest.git.createTag({
              owner, repo, tag: version,
              message: `Release ${version} (PR #${merged.number})`,
              object: sha, type: 'commit'
            });
            await github.rest.git.createRef({
              owner, repo, ref: `refs/tags/${version}`, sha: tag.data.sha
            });
            core.info(`Created ${version} for ${sha}`);
